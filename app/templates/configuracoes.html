{% extends "base.html" %}
{% block titulo %}Configurações{% endblock %}
{% block conteudo %}
<h1>Configurações</h1>
<section class="cartao">
  <form method="post" action="/admin/configuracoes" class="grade">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Destacar variação de preço a partir de (%)
      <input name="variacao_destaque" value="{{ valores.variacao_destaque }}" inputmode="decimal" required></label>
    <label>Preço mínimo no Mercos
      <select name="regra_preco_minimo">
        <option value="fob" {% if valores.regra_preco_minimo == 'fob' %}selected{% endif %}>FOB da tabela do gerente</option>
        <option value="desconto" {% if valores.regra_preco_minimo == 'desconto' %}selected{% endif %}>CIF menos o desconto máximo da tabela</option>
      </select></label>
    <label>Guardar logs e arquivos por (anos)
      <input name="retencao_anos" value="{{ valores.retencao_anos }}" inputmode="numeric" required></label>
    <div class="largo"><button>Salvar</button> <span class="nota">Toda alteração fica no log, com valor antigo e novo.</span></div>
  </form>
</section>
{% endblock %}
